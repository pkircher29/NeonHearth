[package]
name = "lattice-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "NeonHearth"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
fs2.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
sha2.workspace = true
zeroize.workspace = true
tempfile = "3"
reqwest = { workspace = true, features = ["blocking"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
