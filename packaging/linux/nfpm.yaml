# nfpm configuration producing NeonHearth .deb and .rpm packages.
#
# Run from packaging/linux/ on a Linux host AFTER packaging/stage.sh has
# populated packaging/dist/linux/ (relative src paths below resolve from the
# working directory, so run nfpm from this directory):
#
#   export NEONHEARTH_VERSION=0.1.0            # or the tag version, no leading v
#   nfpm package --config nfpm.yaml --packager deb --target ../dist/
#   nfpm package --config nfpm.yaml --packager rpm --target ../dist/
#
# The version comes from the NEONHEARTH_VERSION environment variable (nfpm
# expands ${VAR} in this file). Semver prereleases (0.1.0-alpha.1) are fine:
# nfpm's default semver schema splits the prerelease into the deb version
# (0.1.0~alpha.1) and the rpm release field automatically.
#
# STATUS: exercised with nfpm 2.47.0 (deb + rpm packagers) against a staged
# tree; produced by .github/workflows/release.yml on tagged releases.

name: neonhearth
arch: amd64
platform: linux
version: ${NEONHEARTH_VERSION}
section: net
priority: optional
maintainer: NeonHearth Project <pkircher@gmail.com>
description: |
  NeonHearth home-network collector service.
  Discovers and monitors devices on owner-approved private subnets.
  Serves a loopback-only API on 127.0.0.1:58120.
vendor: NeonHearth Project
homepage: https://github.com/pkircher29/NeonHearth
license: AGPL-3.0-or-later

# ffmpeg is required by the camera media pipeline (crates/lattice-camera
# media.rs spawns it; audit M-18: it was neither packaged nor declared, so
# camera media failed on every clean install). Debian/Ubuntu ship the `ffmpeg`
# package in main. Fedora ships `ffmpeg-free` in the base repos and the full
# `ffmpeg` via RPM Fusion; both provide /usr/bin/ffmpeg, so the rpm depends
# on the file rather than either package name.
overrides:
  deb:
    depends:
      - ffmpeg
  rpm:
    depends:
      - /usr/bin/ffmpeg

contents:
  # Service binary (built by packaging/stage.sh).
  - src: ../dist/linux/bin/lattice-service
    dst: /usr/libexec/neonhearth/lattice-service
    file_info:
      mode: 0755

  # Hardened systemd unit.
  - src: neonhearth.service
    dst: /usr/lib/systemd/system/neonhearth.service
    file_info:
      mode: 0644

  # Dedicated service user.
  - src: neonhearth.sysusers.conf
    dst: /usr/lib/sysusers.d/neonhearth.conf
    file_info:
      mode: 0644

  # Full-capture drop-in shipped as documentation, not active configuration.
  - src: full-capture.conf.example
    dst: /usr/share/doc/neonhearth/full-capture.conf.example
    file_info:
      mode: 0644

  # Desktop UI bundle (Vite build of apps/desktop staged by stage.sh).
  # Installed as data; the service does not serve these over HTTP in this
  # build (loopback API only).
  - src: ../dist/linux/ui
    dst: /usr/share/neonhearth/ui
    type: tree

scripts:
  postinstall: scripts/postinstall.sh
  preremove: scripts/preremove.sh
  postremove: scripts/postremove.sh

# Note on /var/lib/neonhearth: intentionally NOT a package path. The unit's
# StateDirectory=neonhearth creates and owns it at service start, and package
# removal therefore never deletes collected state (see postremove.sh).
