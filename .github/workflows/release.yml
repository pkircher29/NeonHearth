name: Release

# Tagged release: native Windows Home Hub, compatibility MSI, and Linux packages
# from the packaging/ scaffolding and publishes them on a GitHub pre-release.
#
# Version flow: the tag (vX.Y.Z[-pre]) is the single source of truth.
#   - full version  = tag without the leading "v" (names files, the release)
#   - MSI version   = numeric X.Y.Z part only (MSI ProductVersion cannot
#     carry a semver prerelease suffix; WiX gets it via -d MsiVersion)
#   - nfpm receives the full semver via NEONHEARTH_VERSION and splits the
#     prerelease itself (deb: 0.1.0~alpha.1, rpm: version/release fields).

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version (manual builds never publish)
        required: true
        default: "0.1.0-candidate"
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  windows-home-hub:
    name: Windows native Home Hub (recommended ZIP)
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-09-03
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Resolve candidate version
        id: version
        shell: pwsh
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          $full = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v','' } else { $env:MANUAL_VERSION }
          if ($full -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw 'Invalid release version' }
          "full=$full" | Add-Content $env:GITHUB_OUTPUT
      - name: Verify packaging boundaries
        run: python packaging/test_home_hub_package.py
      - name: Build locked native launcher and collector
        run: cargo build --locked --release -p lattice-service -p lattice-launcher
      - name: Build dashboard
        shell: pwsh
        run: |
          npm --prefix apps/desktop ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm --prefix apps/desktop run build
          if ($LASTEXITCODE -ne 0) { throw 'UI build failed' }
      - name: Prepare checksum-pinned broker without installing it
        run: python packaging/windows/prepare-mosquitto.py --output "${{ runner.temp }}/neonhearth-mosquitto"
      - name: Assemble native Home Hub ZIP
        shell: pwsh
        run: |
          python scripts/package-home-hub.py --target target/release --mosquitto "${{ runner.temp }}/neonhearth-mosquitto" --output "packaging/dist/NeonHearth-Home-Hub-${{ steps.version.outputs.full }}-windows-x64" --version "${{ steps.version.outputs.full }}"
          if ($LASTEXITCODE -ne 0) { throw 'Home Hub packaging failed' }
      - name: Validate exact payload and executable loading
        shell: pwsh
        run: |
          $hub = "packaging/dist/NeonHearth-Home-Hub-${{ steps.version.outputs.full }}-windows-x64"
          $manifest = Get-Content -Raw "$hub/PACKAGE-MANIFEST.json" | ConvertFrom-Json
          foreach ($file in $manifest.files) {
            $path = Join-Path $hub $file.path
            if ((Get-Item $path).Length -ne $file.bytes) { throw "Size mismatch: $($file.path)" }
            if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLower() -ne $file.sha256) { throw "Hash mismatch: $($file.path)" }
          }
          $info = Get-Content -Raw "$hub/BUILD-INFO.json" | ConvertFrom-Json
          if ($info.source_commit -ne $env:GITHUB_SHA -or $info.source_dirty) { throw 'Candidate source does not match the clean checkout' }
          $process = Start-Process -FilePath "$PWD/$hub/NeonHearth.exe" -ArgumentList '--help' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Native launcher could not load' }
          $archive = "$hub.zip"
          "$((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower())  $(Split-Path -Leaf $archive)" | Set-Content "$archive.sha256"
      - name: Validate candidate and run isolated native smoke
        shell: pwsh
        run: |
          python -m pip install psutil==7.2.2
          if ($LASTEXITCODE -ne 0) { throw 'Smoke test dependency install failed' }
          $hub = "packaging/dist/NeonHearth-Home-Hub-${{ steps.version.outputs.full }}-windows-x64"
          python scripts/verify-candidate.py --package $hub --output "${{ runner.temp }}/home-hub-verify.json"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate verification failed' }
          # Hosted VMs may have no eligible physical adapter. This checks the
          # authenticated local transport, not physical discovery or a soak.
          python scripts/soak-candidate.py --package $hub --state "${{ runner.temp }}/home-hub-smoke-state" --output "${{ runner.temp }}/home-hub-smoke.json" --port 58131 --mqtt-port 58193 --duration-seconds 15 --interval-seconds 3 --allow-degraded-collector
          if ($LASTEXITCODE -ne 0) { throw 'Isolated native smoke failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-home-hub-verification
          path: |
            ${{ runner.temp }}/home-hub-verify.json
            ${{ runner.temp }}/home-hub-smoke.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-home-hub
          path: |
            packaging/dist/NeonHearth-Home-Hub-*.zip
            packaging/dist/NeonHearth-Home-Hub-*.zip.sha256
          if-no-files-found: error

  windows-installer:
    name: Windows service compatibility installer (MSI)
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive versions from tag
        id: version
        shell: pwsh
        run: |
          $full = $env:GITHUB_REF_NAME -replace '^v', ''
          $msi = ($full -split '-', 2)[0]
          if ($msi -notmatch '^\d+\.\d+\.\d+$') { throw "Tag '$env:GITHUB_REF_NAME' does not start with a numeric x.y.z version" }
          "full=$full" | Add-Content $env:GITHUB_OUTPUT
          "msi=$msi" | Add-Content $env:GITHUB_OUTPUT
          Write-Host "full=$full msi=$msi"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head, 2026-09-03
        with:
          toolchain: 1.96.0

      - name: Record resolved toolchain versions
        shell: pwsh
        run: |
          rustc --version --verbose
          cargo --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Stage Windows release layout (packaging/stage.ps1)
        shell: pwsh
        run: pwsh -File packaging\stage.ps1

      # WiX v5 is required: the <Files> wildcard-harvesting element used for
      # the UI bundle does not exist in WiX 4.x. Pinned to the version the
      # .wxs was verified against.
      - name: Install WiX toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2
          wix --version

      # The bindpath MUST be absolute: the <Files> wildcard harvest resolves a
      # relative bindpath against the .wxs file's own directory (not the
      # working directory), silently harvesting nothing (warning WIX8601).
      # -wx turns that class of warning into a hard build failure.
      - name: Build MSI
        shell: pwsh
        run: |
          wix build packaging\windows\NeonHearth.wxs `
            -ext WixToolset.Util.wixext `
            -bindpath dist=${{ github.workspace }}\packaging\dist\windows `
            -arch x64 `
            -d MsiVersion=${{ steps.version.outputs.msi }} `
            -wx `
            -o NeonHearth-${{ steps.version.outputs.full }}-x64.msi
          if (-not (Test-Path "NeonHearth-${{ steps.version.outputs.full }}-x64.msi")) { throw 'MSI was not produced' }

      # Validation without installing: administrative extract (msiexec /a)
      # unpacks the file table; assert the payload the installer promises.
      - name: Validate MSI payload (administrative extract)
        shell: pwsh
        run: |
          $msi = (Resolve-Path "NeonHearth-${{ steps.version.outputs.full }}-x64.msi").Path
          $target = Join-Path $env:RUNNER_TEMP 'msi-extract'
          $p = Start-Process msiexec.exe -ArgumentList "/a `"$msi`" /qn TARGETDIR=`"$target`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /a failed with exit code $($p.ExitCode)" }
          $required = @(
            'PFiles64\NeonHearth\lattice-service.exe',
            'PFiles64\NeonHearth\scripts\configure-service.ps1',
            'PFiles64\NeonHearth\scripts\open-neonhearth.ps1',
            'PFiles64\NeonHearth\ui\index.html'
          )
          foreach ($rel in $required) {
            $path = Join-Path $target $rel
            if (-not (Test-Path $path)) { throw "MSI payload missing: $rel" }
            Write-Host "present: $rel"
          }
          $jsCount = @(Get-ChildItem -Recurse (Join-Path $target 'PFiles64\NeonHearth\ui') -Filter '*.js').Count
          if ($jsCount -lt 1) { throw 'MSI payload missing: UI JavaScript bundle' }
          Write-Host "UI bundle JS files: $jsCount"

      # Burn bundle (.exe) chaining the MSI just built and validated above.
      # Same absolute-bindpath rule as the MSI build.
      - name: Build setup bundle (exe)
        shell: pwsh
        run: |
          wix build packaging\windows\Bundle.wxs `
            -ext WixToolset.BootstrapperApplications.wixext `
            -bindpath msi=${{ github.workspace }} `
            -arch x64 `
            -d MsiVersion=${{ steps.version.outputs.msi }} `
            -d FullVersion=${{ steps.version.outputs.full }} `
            -wx `
            -o NeonHearth-Setup-${{ steps.version.outputs.full }}-x64.exe
          if (-not (Test-Path "NeonHearth-Setup-${{ steps.version.outputs.full }}-x64.exe")) { throw 'Bundle exe was not produced' }

      # Validation without installing: extract the bundle's attached
      # container and require the embedded payload to be byte-identical to
      # the MSI. (A compressed bundle's /layout is a no-op copy, so this is
      # the real check. wix burn extract silently no-ops with WIX8503 unless
      # the output and intermediate folders already exist.)
      - name: Validate bundle payload (burn extract)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'burn-extract'
          $tmp = Join-Path $env:RUNNER_TEMP 'burn-tmp'
          New-Item -ItemType Directory -Force $out, $tmp | Out-Null
          wix burn extract "NeonHearth-Setup-${{ steps.version.outputs.full }}-x64.exe" -o $out -intermediateFolder $tmp
          $payloads = @(Get-ChildItem -File $out)
          if ($payloads.Count -lt 1) { throw 'burn extract produced no payloads' }
          $msiHash = (Get-FileHash "NeonHearth-${{ steps.version.outputs.full }}-x64.msi" -Algorithm SHA256).Hash
          $match = $payloads | Where-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash -eq $msiHash }
          if (-not $match) { throw 'no extracted bundle payload matches the built MSI (SHA-256)' }
          Write-Host "embedded MSI verified byte-identical: $($match.Name)"

      - name: Compute SHA-256s
        shell: pwsh
        run: |
          foreach ($f in @("NeonHearth-${{ steps.version.outputs.full }}-x64.msi",
                           "NeonHearth-Setup-${{ steps.version.outputs.full }}-x64.exe")) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$hash  $f" | Set-Content "$f.sha256"
            Get-Content "$f.sha256"
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-msi
          path: |
            NeonHearth-${{ steps.version.outputs.full }}-x64.msi
            NeonHearth-${{ steps.version.outputs.full }}-x64.msi.sha256
            NeonHearth-Setup-${{ steps.version.outputs.full }}-x64.exe
            NeonHearth-Setup-${{ steps.version.outputs.full }}-x64.exe.sha256
          if-no-files-found: error

  linux-packages:
    name: Linux packages (deb, rpm)
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive version from tag
        id: version
        run: |
          full="${GITHUB_REF_NAME#v}"
          base="${full%%-*}"
          case "$base" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Tag '$GITHUB_REF_NAME' does not start with a numeric x.y.z version" >&2; exit 1 ;;
          esac
          workspace="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$base" != "$workspace" ]; then
            echo "Tag base version $base does not match workspace version $workspace" >&2
            exit 1
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "full=$full base=$base workspace=$workspace"

      # Same rationale as ci.yml's rust job: reclaim hosted-image space the
      # release build may need for its link step.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head, 2026-09-03
        with:
          toolchain: 1.96.0

      - name: Record resolved toolchain versions
        run: |
          rustc --version --verbose
          cargo --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Stage Linux release layout (packaging/stage.sh)
        run: packaging/stage.sh

      - name: Install nfpm (pinned, checksum-verified)
        run: |
          curl -sSLo nfpm.deb https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_amd64.deb
          echo "3f1cf344bd0b57373ca55636a78c08b0491f7293d609a456a9ac3b0b150fda97  nfpm.deb" | sha256sum -c -
          sudo dpkg -i nfpm.deb
          rm nfpm.deb
          nfpm --version

      - name: Build deb and rpm packages
        env:
          NEONHEARTH_VERSION: ${{ steps.version.outputs.full }}
        run: |
          cd packaging/linux
          nfpm package --config nfpm.yaml --packager deb --target ../dist/
          nfpm package --config nfpm.yaml --packager rpm --target ../dist/
          ls -la ../dist/

      - name: Validate package payloads
        run: |
          deb="$(ls packaging/dist/*.deb)"
          rpm="$(ls packaging/dist/*.rpm)"
          echo "== $deb =="
          dpkg-deb --contents "$deb"
          dpkg-deb --contents "$deb" | grep -q '/usr/libexec/neonhearth/lattice-service' || { echo 'deb missing service binary' >&2; exit 1; }
          dpkg-deb --contents "$deb" | grep -q '/usr/lib/systemd/system/neonhearth.service' || { echo 'deb missing systemd unit' >&2; exit 1; }
          dpkg-deb --contents "$deb" | grep -q '/usr/share/neonhearth/ui/index.html' || { echo 'deb missing UI bundle' >&2; exit 1; }
          echo "== $rpm =="
          sudo apt-get install -y rpm cpio >/dev/null
          rpm2cpio "$rpm" | cpio -t
          rpm2cpio "$rpm" | cpio -t | grep -q 'usr/libexec/neonhearth/lattice-service' || { echo 'rpm missing service binary' >&2; exit 1; }
          rpm2cpio "$rpm" | cpio -t | grep -q 'usr/lib/systemd/system/neonhearth.service' || { echo 'rpm missing systemd unit' >&2; exit 1; }

      - name: Compute SHA-256s
        run: |
          cd packaging/dist
          for f in *.deb *.rpm; do
            sha256sum "$f" | tee "$f.sha256"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages
          path: |
            packaging/dist/*.deb
            packaging/dist/*.rpm
            packaging/dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub pre-release
    runs-on: ubuntu-latest
    needs: [windows-home-hub, windows-installer, linux-packages]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble release assets + SHA256SUMS
        id: assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.zip' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} release-assets/ \;
          cd release-assets
          ls -la
          [ -n "$(ls NeonHearth-Home-Hub-*.zip 2>/dev/null)" ] || { echo 'no native Home Hub artifact' >&2; exit 1; }
          [ -n "$(ls *.msi 2>/dev/null)" ] || { echo 'no MSI artifact' >&2; exit 1; }
          [ -n "$(ls *.exe 2>/dev/null)" ] || { echo 'no setup exe artifact' >&2; exit 1; }
          [ -n "$(ls *.deb 2>/dev/null)" ] || { echo 'no deb artifact' >&2; exit 1; }
          [ -n "$(ls *.rpm 2>/dev/null)" ] || { echo 'no rpm artifact' >&2; exit 1; }
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: NeonHearth ${{ github.ref_name }}
          prerelease: true
          files: |
            release-assets/*
          body: |
            **Pre-release: unsigned, not clean-machine tested.**

            **Recommended Windows download: NeonHearth-Home-Hub-...-windows-x64.zip.**
            Extract the complete folder and open NeonHearth.exe. It includes the
            native launcher, collector and authenticated local MQTT broker.
            No Npcap, Python, Node or administrator rights are needed to run it;
            the broker requires Microsoft's Visual C++ 2015–2022 x64 runtime.
            The MSI/Setup EXE remain separate legacy-service compatibility assets.
            Existing service users must back up and deliberately stop that service
            before switching; private databases are not silently migrated.

            These installer artifacts are built and payload-validated in CI
            (MSI administrative extract, setup-exe bundle extraction, deb/rpm
            content listing), but:

            - Nothing is code-signed (RLS7 untouched); Windows SmartScreen and
              apt/rpm signature checks will flag them.
            - No clean-machine install/upgrade/uninstall acceptance has been
              performed, so RLS4 (Windows installer) and RLS5 (Linux packages)
              remain **not complete**.
            - Windows discovery uses native APIs; Npcap is not required by
              either the Home Hub or current service compatibility package.

            See `docs/build/installers.md` for the full honest status of what
            is and is not verified.
