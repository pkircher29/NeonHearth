name: Release

# Tagged-release pipeline: builds the Windows MSI and Linux deb/rpm packages
# from the packaging/ scaffolding and publishes them on a GitHub pre-release.
#
# Version flow: the tag (vX.Y.Z[-pre]) is the single source of truth.
#   - full version  = tag without the leading "v" (names files, the release)
#   - MSI version   = numeric X.Y.Z part only (MSI ProductVersion cannot
#     carry a semver prerelease suffix; WiX gets it via -d MsiVersion)
#   - nfpm receives the full semver via NEONHEARTH_VERSION and splits the
#     prerelease itself (deb: 0.1.0~alpha.1, rpm: version/release fields).

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  windows-installer:
    name: Windows installer (MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Derive versions from tag
        id: version
        shell: pwsh
        run: |
          $full = $env:GITHUB_REF_NAME -replace '^v', ''
          $msi = ($full -split '-', 2)[0]
          if ($msi -notmatch '^\d+\.\d+\.\d+$') { throw "Tag '$env:GITHUB_REF_NAME' does not start with a numeric x.y.z version" }
          "full=$full" | Add-Content $env:GITHUB_OUTPUT
          "msi=$msi" | Add-Content $env:GITHUB_OUTPUT
          Write-Host "full=$full msi=$msi"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Record resolved toolchain versions
        shell: pwsh
        run: |
          rustc --version --verbose
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # Hosted Windows runners have no Npcap installed, but compiling the
      # workspace needs Npcap's Packet.lib import library at link time
      # (pnet_datalink). The freely redistributable Npcap SDK provides it;
      # RUSTFLAGS points the linker at its x64 import libraries. The SDK is
      # only a build input - the MSI does not ship any Npcap component and
      # end users still install Npcap themselves (see configure-service.ps1
      # limited mode).
      - name: Install Npcap SDK (import libraries for linking)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'npcap-sdk-1.13.zip'
          Invoke-WebRequest -Uri 'https://npcap.com/dist/npcap-sdk-1.13.zip' -OutFile $zip
          $expected = 'DAD1F2BF1B02B787BE08CA4862F99E39A876C1F274BAC4AC0CEDC9BBC58F94FD'
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "npcap-sdk-1.13.zip SHA-256 mismatch: got $actual, expected $expected" }
          $sdk = Join-Path $env:RUNNER_TEMP 'npcap-sdk'
          Expand-Archive $zip -DestinationPath $sdk -Force
          if (-not (Test-Path (Join-Path $sdk 'Lib\x64\Packet.lib'))) { throw 'Packet.lib missing from extracted SDK' }
          "RUSTFLAGS=-L $sdk\Lib\x64" | Add-Content $env:GITHUB_ENV

      - name: Stage Windows release layout (packaging/stage.ps1)
        shell: pwsh
        run: pwsh -File packaging\stage.ps1

      # WiX v5 is required: the <Files> wildcard-harvesting element used for
      # the UI bundle does not exist in WiX 4.x. Pinned to the version the
      # .wxs was verified against.
      - name: Install WiX toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2
          wix --version

      # The bindpath MUST be absolute: the <Files> wildcard harvest resolves a
      # relative bindpath against the .wxs file's own directory (not the
      # working directory), silently harvesting nothing (warning WIX8601).
      # -wx turns that class of warning into a hard build failure.
      - name: Build MSI
        shell: pwsh
        run: |
          wix build packaging\windows\NeonHearth.wxs `
            -ext WixToolset.Util.wixext `
            -bindpath dist=${{ github.workspace }}\packaging\dist\windows `
            -arch x64 `
            -d MsiVersion=${{ steps.version.outputs.msi }} `
            -wx `
            -o NeonHearth-${{ steps.version.outputs.full }}-x64.msi
          if (-not (Test-Path "NeonHearth-${{ steps.version.outputs.full }}-x64.msi")) { throw 'MSI was not produced' }

      # Validation without installing: administrative extract (msiexec /a)
      # unpacks the file table; assert the payload the installer promises.
      - name: Validate MSI payload (administrative extract)
        shell: pwsh
        run: |
          $msi = (Resolve-Path "NeonHearth-${{ steps.version.outputs.full }}-x64.msi").Path
          $target = Join-Path $env:RUNNER_TEMP 'msi-extract'
          $p = Start-Process msiexec.exe -ArgumentList "/a `"$msi`" /qn TARGETDIR=`"$target`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /a failed with exit code $($p.ExitCode)" }
          $required = @(
            'PFiles64\NeonHearth\lattice-service.exe',
            'PFiles64\NeonHearth\scripts\configure-service.ps1',
            'PFiles64\NeonHearth\ui\index.html'
          )
          foreach ($rel in $required) {
            $path = Join-Path $target $rel
            if (-not (Test-Path $path)) { throw "MSI payload missing: $rel" }
            Write-Host "present: $rel"
          }
          $jsCount = @(Get-ChildItem -Recurse (Join-Path $target 'PFiles64\NeonHearth\ui') -Filter '*.js').Count
          if ($jsCount -lt 1) { throw 'MSI payload missing: UI JavaScript bundle' }
          Write-Host "UI bundle JS files: $jsCount"

      # Burn bundle (.exe) chaining the MSI just built and validated above.
      # Same absolute-bindpath rule as the MSI build.
      - name: Build setup bundle (exe)
        shell: pwsh
        run: |
          wix build packaging\windows\Bundle.wxs `
            -ext WixToolset.BootstrapperApplications.wixext `
            -bindpath msi=${{ github.workspace }} `
            -arch x64 `
            -d MsiVersion=${{ steps.version.outputs.msi }} `
            -d FullVersion=${{ steps.version.outputs.full }} `
            -wx `
            -o NeonHearth-Setup-${{ steps.version.outputs.full }}-x64.exe
          if (-not (Test-Path "NeonHearth-Setup-${{ steps.version.outputs.full }}-x64.exe")) { throw 'Bundle exe was not produced' }

      # Validation without installing: extract the bundle's attached
      # container and require the embedded payload to be byte-identical to
      # the MSI. (A compressed bundle's /layout is a no-op copy, so this is
      # the real check. wix burn extract silently no-ops with WIX8503 unless
      # the output and intermediate folders already exist.)
      - name: Validate bundle payload (burn extract)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'burn-extract'
          $tmp = Join-Path $env:RUNNER_TEMP 'burn-tmp'
          New-Item -ItemType Directory -Force $out, $tmp | Out-Null
          wix burn extract "NeonHearth-Setup-${{ steps.version.outputs.full }}-x64.exe" -o $out -intermediateFolder $tmp
          $payloads = @(Get-ChildItem -File $out)
          if ($payloads.Count -lt 1) { throw 'burn extract produced no payloads' }
          $msiHash = (Get-FileHash "NeonHearth-${{ steps.version.outputs.full }}-x64.msi" -Algorithm SHA256).Hash
          $match = $payloads | Where-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash -eq $msiHash }
          if (-not $match) { throw 'no extracted bundle payload matches the built MSI (SHA-256)' }
          Write-Host "embedded MSI verified byte-identical: $($match.Name)"

      - name: Compute SHA-256s
        shell: pwsh
        run: |
          foreach ($f in @("NeonHearth-${{ steps.version.outputs.full }}-x64.msi",
                           "NeonHearth-Setup-${{ steps.version.outputs.full }}-x64.exe")) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$hash  $f" | Set-Content "$f.sha256"
            Get-Content "$f.sha256"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-msi
          path: |
            NeonHearth-${{ steps.version.outputs.full }}-x64.msi
            NeonHearth-${{ steps.version.outputs.full }}-x64.msi.sha256
            NeonHearth-Setup-${{ steps.version.outputs.full }}-x64.exe
            NeonHearth-Setup-${{ steps.version.outputs.full }}-x64.exe.sha256
          if-no-files-found: error

  linux-packages:
    name: Linux packages (deb, rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Derive version from tag
        id: version
        run: |
          full="${GITHUB_REF_NAME#v}"
          base="${full%%-*}"
          case "$base" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Tag '$GITHUB_REF_NAME' does not start with a numeric x.y.z version" >&2; exit 1 ;;
          esac
          workspace="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$base" != "$workspace" ]; then
            echo "Tag base version $base does not match workspace version $workspace" >&2
            exit 1
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "full=$full base=$base workspace=$workspace"

      # Same rationale as ci.yml's rust job: reclaim hosted-image space the
      # release build may need for its link step.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Record resolved toolchain versions
        run: |
          rustc --version --verbose
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Stage Linux release layout (packaging/stage.sh)
        run: packaging/stage.sh

      - name: Install nfpm (pinned, checksum-verified)
        run: |
          curl -sSLo nfpm.deb https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_amd64.deb
          echo "3f1cf344bd0b57373ca55636a78c08b0491f7293d609a456a9ac3b0b150fda97  nfpm.deb" | sha256sum -c -
          sudo dpkg -i nfpm.deb
          rm nfpm.deb
          nfpm --version

      - name: Build deb and rpm packages
        env:
          NEONHEARTH_VERSION: ${{ steps.version.outputs.full }}
        run: |
          cd packaging/linux
          nfpm package --config nfpm.yaml --packager deb --target ../dist/
          nfpm package --config nfpm.yaml --packager rpm --target ../dist/
          ls -la ../dist/

      - name: Validate package payloads
        run: |
          deb="$(ls packaging/dist/*.deb)"
          rpm="$(ls packaging/dist/*.rpm)"
          echo "== $deb =="
          dpkg-deb --contents "$deb"
          dpkg-deb --contents "$deb" | grep -q '/usr/libexec/neonhearth/lattice-service' || { echo 'deb missing service binary' >&2; exit 1; }
          dpkg-deb --contents "$deb" | grep -q '/usr/lib/systemd/system/neonhearth.service' || { echo 'deb missing systemd unit' >&2; exit 1; }
          dpkg-deb --contents "$deb" | grep -q '/usr/share/neonhearth/ui/index.html' || { echo 'deb missing UI bundle' >&2; exit 1; }
          echo "== $rpm =="
          sudo apt-get install -y rpm cpio >/dev/null
          rpm2cpio "$rpm" | cpio -t
          rpm2cpio "$rpm" | cpio -t | grep -q 'usr/libexec/neonhearth/lattice-service' || { echo 'rpm missing service binary' >&2; exit 1; }
          rpm2cpio "$rpm" | cpio -t | grep -q 'usr/lib/systemd/system/neonhearth.service' || { echo 'rpm missing systemd unit' >&2; exit 1; }

      - name: Compute SHA-256s
        run: |
          cd packaging/dist
          for f in *.deb *.rpm; do
            sha256sum "$f" | tee "$f.sha256"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            packaging/dist/*.deb
            packaging/dist/*.rpm
            packaging/dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub pre-release
    runs-on: ubuntu-latest
    needs: [windows-installer, linux-packages]
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble release assets + SHA256SUMS
        id: assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} release-assets/ \;
          cd release-assets
          ls -la
          [ -n "$(ls *.msi 2>/dev/null)" ] || { echo 'no MSI artifact' >&2; exit 1; }
          [ -n "$(ls *.exe 2>/dev/null)" ] || { echo 'no setup exe artifact' >&2; exit 1; }
          [ -n "$(ls *.deb 2>/dev/null)" ] || { echo 'no deb artifact' >&2; exit 1; }
          [ -n "$(ls *.rpm 2>/dev/null)" ] || { echo 'no rpm artifact' >&2; exit 1; }
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          name: NeonHearth ${{ github.ref_name }}
          prerelease: true
          files: |
            release-assets/*
          body: |
            **Pre-release: unsigned, not clean-machine tested.**

            These installer artifacts are built and payload-validated in CI
            (MSI administrative extract, setup-exe bundle extraction, deb/rpm
            content listing), but:

            - Nothing is code-signed (RLS7 untouched); Windows SmartScreen and
              apt/rpm signature checks will flag them.
            - No clean-machine install/upgrade/uninstall acceptance has been
              performed, so RLS4 (Windows installer) and RLS5 (Linux packages)
              remain **not complete**.
            - The Windows service requires [Npcap](https://npcap.com/) at
              runtime; without it the service is registered in limited mode
              (Manual/stopped) as described in the installer docs.

            See `docs/build/installers.md` for the full honest status of what
            is and is not verified.
