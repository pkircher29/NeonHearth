name: Signing check

# Signs a throwaway program to prove the Azure Artifact Signing set-up works,
# without waiting for a full release build.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    environment: release-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build a throwaway program
        shell: pwsh
        run: |
          'fn main() { println!("signing check"); }' | Set-Content check.rs
          rustc check.rs -o signing-check.exe
      - name: Sign in to Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Prepare code signing
        shell: pwsh
        run: ./scripts/windows-signing/setup.ps1 -Endpoint "${{ vars.ARTIFACT_SIGNING_ENDPOINT }}" -Account "${{ vars.ARTIFACT_SIGNING_ACCOUNT }}" -CertificateProfile "${{ vars.ARTIFACT_SIGNING_PROFILE }}"
      - name: Sign
        shell: pwsh
        run: |
          Get-Content $env:TAURI_SIGNING_CONFIG
          ./scripts/windows-signing/sign.ps1 signing-check.exe
      - name: Verify
        shell: pwsh
        run: ./scripts/windows-signing/verify.ps1 -Publisher "${{ vars.ARTIFACT_SIGNING_PUBLISHER }}" signing-check.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signing-check-${{ matrix.os }}
          path: signing-check.exe
          retention-days: 3
