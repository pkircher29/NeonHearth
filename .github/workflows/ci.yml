name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
      - "claude/**"
  pull_request:
    branches:
      - main
      - "codex/**"
      - "claude/**"

env:
  CARGO_TERM_COLOR: always

# Supply-chain note (audit M-22): every third-party action is pinned to a full
# commit SHA with the resolved tag in a trailing comment. Bump by resolving the
# new tag's commit (`gh api repos/<owner>/<repo>/tags`) and updating both the
# SHA and the comment together. dtolnay/rust-toolchain has no version tags; it
# is pinned to a commit of its `stable` branch and the toolchain is named
# explicitly via `with.toolchain` (keep in sync with rust-toolchain.toml).

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    env:
      # Full debuginfo made the combined clippy + test artifact tree exhaust
      # the hosted runner's disk: ld was killed with SIGBUS mid-link (a write
      # to an mmapped output on a full filesystem). Line tables keep test
      # backtraces useful at a fraction of the size.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The hosted image ships ~30GB of toolchains this job never uses; the
      # debug build of this workspace (wasmtime, cranelift, sqlx, ...) needs
      # that headroom to link its test binaries.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      # rust-toolchain.toml pins 1.96.0. Because the action is pinned by SHA
      # (its ref no longer names a channel) the toolchain is passed explicitly.
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head, 2026-09-03
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      # Toolchain evidence: record the resolved compiler version in the log
      # (docs/build/toolchain.md requires CI to record this).
      - name: Record resolved toolchain versions
        run: |
          rustc --version --verbose
          cargo --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

  windows-native:
    name: Windows native launcher and socket binding
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head, 2026-09-03
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test native launcher boundaries
        run: cargo test --locked -p lattice-launcher
      - name: Test native inventory and Winsock binding without Npcap
        run: cargo test --locked -p lattice-sensor --lib --test windows_binding
      - name: Test native host telemetry and authenticated device labels
        run: cargo test --locked -p lattice-service --lib --test device_names --test host_monitor_api

  deny:
    name: cargo-deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    env:
      # The action runs in its own container with its own rustup; the repo's
      # rust-toolchain.toml pin (1.96.0) is not installed there. cargo-deny
      # only reads Cargo.lock, so any toolchain will do.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # No extra feature flags: match the graph settings in deny.toml so the
          # CI gate checks exactly what `cargo deny check` checks locally.
          arguments: ""

  web:
    name: Web (desktop app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Record resolved Node/npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test -- --run

      - name: Type/lint check
        run: npm run check

      - name: Build
        run: npm run build

  e2e:
    # Browser-level gate (audit M-23). The Playwright specs under
    # apps/desktop/e2e mock the collector API with page.route handlers
    # (e2e/fixtures/home.ts, guard.spec.ts), so only the Vite dev server is
    # needed; playwright.config.ts starts it itself via `webServer`.
    name: Web e2e (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          if-no-files-found: ignore

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head, 2026-09-03
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Generate Rust SBOMs (CycloneDX JSON, one per crate)
        run: cargo cyclonedx --format json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop app dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Generate npm SBOM (CycloneDX JSON)
        run: npm sbom --sbom-format cyclonedx --package-lock-only > desktop.cdx.json
        working-directory: apps/desktop

      - name: Collect SBOMs
        run: |
          mkdir -p sbom-out
          find crates tools apps -name '*.cdx.json' -exec cp {} sbom-out/ \;

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom-out/
          if-no-files-found: error
